<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14251f">
  <title>Zita adventi kalendáriuma ❤️</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Egy kis adventi meglepetés, csak neked.">
  <meta property="og:title" content="Zita adventi kalendáriuma ❤️">
  <meta property="og:description" content="Minden napra egy apró meglepetés.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="ikonok/favicon-32.png">
  <link rel="apple-touch-icon" href="ikonok/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zita Advent">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <div class="eyebrow" id="siteEyebrow">EGY KIS MEGLEPETÉS NEKED</div>
      <h1 id="siteTitle">Zita adventi<br><em>kalendáriuma</em></h1>
      <p class="intro" id="siteIntro">Minden napra egy apró meglepetés, emlék vagy üzenet. ❤️</p>
      <div class="date-line" id="dateLine"></div>
      <div class="countdown" id="countdown" aria-live="polite"></div>
    </header>

    <section class="calendar-wrap" aria-label="Adventi kalendárium">
      <div class="section-heading">
        <span>DECEMBER</span>
        <span class="tiny-heart">♥</span>
        <span>1 — 24</span>
      </div>
      <div class="calendar" id="calendar"></div>
      <p class="hint" id="siteHint">Keresd meg a számokat a mozaikban! Mindegyik a saját napján, éjfélkor nyílik ki. ✨</p>
    </section>
    <footer id="siteFooter">Csak neked készítettem, Zita. <span>♥</span></footer>
  </main>

  <button class="install-btn" id="installBtn" type="button" hidden>📲 Telepítés a telefonra</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button class="close" id="closeModal" aria-label="Bezárás">×</button>
      <div class="modal-day" id="modalDay"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalMessage"></p>
      <div class="gift-gallery" id="imageWrap" hidden></div>
      <p class="gift-caption" id="giftCaption" hidden></p>
      <a class="gift-link" id="giftLink" target="_blank" rel="noopener" hidden></a>
      <div class="modal-signoff" id="siteSignoff">Szeretettel, neked. ❤️</div>
    </div>
  </div>
  <script src="gifts.js"></script>
  <script src="app.js"></script>
  <script src="admin-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
